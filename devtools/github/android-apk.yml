# Android APK (Capacitor) built on GitHub's servers – no Android Studio needed.
# Copy this file to .github/workflows/android-apk.yml in the repository (on github.com: Add file → Create new file).
# Runs on every push that changes the game (or by hand: Actions → Android APK → Run workflow).
# The APK appears under Releases (direct download link) and as a workflow artifact.
#
# Signing (so a new APK installs over the old one and players keep their progress): repository secrets
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them a debug APK is built (installable, but every build has another key: uninstall before updating).
# Optional repository variables: VITE_CONTENT_URL (maps on R2), VITE_API_URL (leaderboard), VITE_ADMIN_HASH.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_CONTENT_URL: ${{ vars.VITE_CONTENT_URL || vars.CONTENT_URL || 'https://pub-7ae23beecc234f6db27b50f0de832e9e.r2.dev/' }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_ADMIN_HASH: ${{ vars.VITE_ADMIN_HASH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Web build (the game)
        run: |
          npm ci
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets: building a debug APK"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          V=$(node -p "require('../package.json').version")
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            TASK=assembleRelease; OUT=app/build/outputs/apk/release/app-release.apk
          else
            TASK=assembleDebug; OUT=app/build/outputs/apk/debug/app-debug.apk
          fi
          ./gradlew "$TASK" -PversionCode=${{ github.run_number }} -PversionName="$V" --no-daemon --stacktrace
          mkdir -p ../apk
          cp "$OUT" "../apk/SkywardParkour-$V-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SkywardParkour-apk
          path: apk/*.apk

      - name: Release (download link for phones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build${{ github.run_number }}" apk/*.apk \
            --title "Skyward Parkour Android – build ${{ github.run_number }}" \
            --notes "APK built from ${{ github.sha }}. On the phone: download the .apk, open it, allow installing from this source." \
            --latest
