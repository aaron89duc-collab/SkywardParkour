# Đưa map (thư mục packs/ và Map 001) lên Cloudflare R2 mỗi khi bạn push lên GitHub. Không cần chạy lệnh nào trên máy.
#
# Chỉ chạy khi đã khai báo trong GitHub → repo → Settings → Secrets and variables → Actions:
#   Variables: CONTENT_URL = https://pub-xxxx.r2.dev/   (bắt buộc; chưa có thì workflow tự bỏ qua)
#              R2_BUCKET   = tên bucket                  (không bắt buộc, mặc định skyward-maps)
#   Secrets:   CLOUDFLARE_API_TOKEN  (token có quyền Account · Workers R2 Storage · Edit)
#              CLOUDFLARE_ACCOUNT_ID
# Chạy tay: tab Actions → Publish maps to R2 → Run workflow.
name: Publish maps to R2

on:
  push:
    branches: [main, master]
    paths:
      - 'packs/**'
      - 'public/maps/**'
      - 'public/assets/map001/**'
      - 'devtools/content.mjs'
      - 'devtools/r2-cors.json'
      - '.github/workflows/publish-maps.yml'
  workflow_dispatch:

concurrency:
  group: publish-maps
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.CONTENT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'skyward-maps' }}
      CONTENT_URL: ${{ vars.CONTENT_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Allow the game to read maps (CORS)
        run: node devtools/content.mjs cors
      - name: Upload changed maps (files first, manifest.json last)
        run: node devtools/content.mjs publish
